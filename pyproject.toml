[project]
name = "tdf-converter"
version = "0.1.0"
description = "Convert documents into a token-dense, LLM-native format"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
bench = ["markitdown[all]>=0.1", "pytest>=8"]

[project.scripts]
tdf = "tdf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdf*"]
